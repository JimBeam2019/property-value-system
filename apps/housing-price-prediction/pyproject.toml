[project]
name = "housing-price-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Jim", email = "bingking68@hotmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi[standard]>=0.141.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
housing-price-prediction = "housing_price_prediction:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/housing_price_prediction"]
